server {
    listen 80;
    server_name admin.52-153-234-132.sslip.io;
    access_log off;
    location ^~ /.well-known/acme-challenge/ {
        root /var/lib/alexandria-acme;
        default_type text/plain;
    }
    location / { return 301 https://admin.52-153-234-132.sslip.io$request_uri; }
}
server {
    listen 443 ssl;
    server_name admin.52-153-234-132.sslip.io;
    ssl_certificate /etc/letsencrypt/live/alexandria-admin-staging/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/alexandria-admin-staging/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_session_tickets off;
    server_tokens off;
    client_max_body_size 10m;
    access_log off;
    error_log /dev/null crit;
    add_header Strict-Transport-Security "max-age=86400" always;
    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $http_host;
        proxy_set_header Connection "";
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 300s;
    }
}

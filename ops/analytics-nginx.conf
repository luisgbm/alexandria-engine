# http context. Excludes query strings, credentials, cookies and full referrers.
map $request_uri $alexandria_analytics_path {
    ~^([^?]*) $1;
    default /;
}
map $http_referer $alexandria_referrer_host {
    "~*^https?://([^/:?#]+)" $1;
    default "";
}
map $http_x_alexandria_analytics $alexandria_analytics_record {
    ignore 0;
    default 1;
}
log_format alexandria_analytics escape=json
    '{"id":"$request_id","time":"$time_iso8601","ip":"$remote_addr",'
    '"method":"$request_method","uri":"$alexandria_analytics_path",'
    '"status":"$status","bytes":"$body_bytes_sent","host":"$host",'
    '"ua":"$http_user_agent","referer_host":"$alexandria_referrer_host",'
    '"skip":""}';

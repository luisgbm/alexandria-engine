[package]
name = "alexandria-engine"
version = "0.1.0"
edition = "2024"
license = "MIT"
description = "Portable WordPress import and deterministic static publishing"

[dependencies]
anyhow = "1"
ammonia = "4"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
clap = { version = "4", features = ["derive"] }
csv = "1"
flate2 = "1"
kuchiki = "0.8"
percent-encoding = "2"
regex = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
tar = "0.4"
unicode-normalization = "0.1"
url = "2"
jsonschema = { version = "0.60.0", default-features = false }
[target.'cfg(unix)'.dependencies]
axum = { version = "0.8.9", features = ["multipart"] }
tokio = { version = "1.54.1", features = ["full"] }
webauthn-rs = "0.5.5"
rusqlite = { version = "0.40.2", features = ["bundled"] }
libc = "0.2"
uuid = { version = "1.28.0", features = ["v4", "serde"] }
image = { version = "0.25.10", default-features = false, features = ["jpeg", "png", "gif", "webp"] }
tower-http = { version = "0.7.1", features = ["limit"] }

[dev-dependencies]
tempfile = "3"
tower = { version = "0.5.3", features = ["util"] }

[target.'cfg(unix)'.dev-dependencies]
webauthn-authenticator-rs = { version = "0.5.5", default-features = false, features = ["softpasskey"] }
